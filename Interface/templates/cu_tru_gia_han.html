{% extends "base.html" %}
{% block title %}Gia hạn cư trú{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Gia hạn cư trú đã hết hạn</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">CCCD</label>
                            <input type="text" class="form-control" value="{{ record[1] }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" class="form-control" value="{{ record[5] }}, {{ record[6] }}, {{ record[7] }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày bắt đầu</label>
                            <input type="text" class="form-control" value="{{ record[3].strftime('%d/%m/%Y') if record[3] else '' }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày kết thúc cũ</label>
                            <input type="text" class="form-control" value="{{ record[4].strftime('%d/%m/%Y') if record[4] else '' }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày kết thúc mới <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" name="new_thoidiemketthuc" min="{{ record[4].strftime('%Y-%m-%d') if record[4] else '' }}" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('cu_tru_list') }}" class="btn btn-secondary">Quay lại</a>
                            <button type="submit" class="btn btn-success">Gia hạn</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
